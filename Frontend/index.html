    <script>
      // apply the saved theme before the app loads so the page does not flash white
      try {
        // light unless the visitor chose dark ("system" from older versions counts as light)
        var t = localStorage.getItem("gfw-theme")
        if (t !== "light" && t !== "dark") localStorage.removeItem("gfw-theme")
        if (t === "dark") document.documentElement.classList.add("dark")
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
